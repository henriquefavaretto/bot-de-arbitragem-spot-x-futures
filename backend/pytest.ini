[pytest]
testpaths = tests
asyncio_mode = auto
# `asyncio_mode = auto` evita ter que decorar cada teste assíncrono com
# @pytest.mark.asyncio. Quase toda a lógica testável aqui é assíncrona
# (o motor do bot é asyncio de ponta a ponta), então o modo automático é o
# padrão que gera menos ruído.
filterwarnings =
    error::RuntimeWarning
